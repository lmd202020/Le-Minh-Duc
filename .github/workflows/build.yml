name: Build Maximum Hardened Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build OGIOS (Maximum Hardened)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build archive (unsigned)
        run: |
          cd source
          chmod +x build_unsigned.sh
          ./build_unsigned.sh

      - name: Locate App and Patches Path
        id: locate
        run: |
          cd source
          FOUND_APP=$(find "$(pwd)/build" -name "*.app" -type d | head -n 1)
          if [ -z "$FOUND_APP" ]; then 
            echo "❌ Không tìm thấy file .app"
            exit 1
          fi
          echo "app_path=$FOUND_APP" >> $GITHUB_OUTPUT
          
          APP_DIR=$(dirname "$FOUND_APP")
          echo "app_dir=$APP_DIR" >> $GITHUB_OUTPUT

          # Tìm thư mục Patches bên trong file .app
          FOUND_PATCHES=$(find "$FOUND_APP" -type d -name "Patches" | head -n 1)
          if [ -z "$FOUND_PATCHES" ]; then 
            # Không tìm thấy thì cảnh báo và để trống output, KHÔNG exit 1
            echo "⚠️ Không tìm thấy thư mục Patches bên trong .app. Sẽ bỏ qua bước mã hóa."
            echo "patches_path=" >> $GITHUB_OUTPUT
          else
            echo "patches_path=$FOUND_PATCHES" >> $GITHUB_OUTPUT
          fi

      - name: Encrypt & Remove Patches Folder (AES-256)
        if: ${{ steps.locate.outputs.patches_path != '' }}
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          APP_DIR="${{ steps.locate.outputs.app_dir }}"
          PATCHES_PATH="${{ steps.locate.outputs.patches_path }}"
          AES_KEY="00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"

          echo "Đang xử lý thư mục: $PATCHES_PATH"
          
          cd "$PATCHES_PATH"
          zip -r -9 "$APP_DIR/patches_tmp.zip" . > /dev/null
          
          cd "$APP_DIR"
          IV=$(openssl rand -hex 16)
          openssl enc -aes-256-cbc -K "$AES_KEY" -iv "$IV" -in "patches_tmp.zip" -out "encrypted_tmp.bin"

          printf '\x89\x50\x4E\x47\x0D\x0A\x1A\x0A' > "$APP_DIR/sys_cache.dat"
          echo -n "$IV" >> "$APP_DIR/sys_cache.dat"
          cat "encrypted_tmp.bin" >> "$APP_DIR/sys_cache.dat"

          rm -rf "$PATCHES_PATH"
          rm -f "patches_tmp.zip" "encrypted_tmp.bin"
          echo "✅ Đã mã hóa và xóa hoàn toàn thư mục Patches"

      - name: Package IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          APP_DIR="${{ steps.locate.outputs.app_dir }}"
          
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          if [ -f "$APP_DIR/sys_cache.dat" ]; then
            cp "$APP_DIR/sys_cache.dat" .
          fi
          
          zip -r -9 OGIOS-hardened-unsigned.ipa Payload sys_cache.dat 2>/dev/null || zip -r -9 OGIOS-hardened-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-hardened-ipa
          path: OGIOS-hardened-unsigned.ipa
          if-no-files-found: error

      - name: Upload Xcode diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ogios-build-diagnostics
          path: |
            source/build/logs/*.log
            source/build/OGIOS.xcarchive/Logs/**
          if-no-files-found: warn
